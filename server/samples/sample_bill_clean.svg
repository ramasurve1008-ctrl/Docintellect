  <text x="65" y="471" font-family="Arial, sans-serif" font-size="12" fill="#334155">CPT-99223</text>
  <text x="160" y="471" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">Inpatient Hospital Care, Initial High Complexity</text>
  <text x="540" y="471" font-family="Arial, sans-serif" font-size="13" fill="#334155">1</text>
  <text x="610" y="471" font-family="Arial, sans-serif" font-size="13" fill="#334155">₹750.00</text>
  <text x="690" y="471" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">₹750.00</text>
  <line x1="50" y1="487" x2="750" y2="487" stroke="#f1f5f9"/>

  <!-- Row 2 -->
  <rect x="50" y="488" width="700" height="42" fill="#f8fafc"/>
  <text x="65" y="514" font-family="Arial, sans-serif" font-size="12" fill="#334155">CPT-93010</text>
  <text x="160" y="514" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">12-Lead Electrocardiogram (ECG) with interpretation</text>
  <text x="540" y="514" font-family="Arial, sans-serif" font-size="13" fill="#334155">1</text>
  <text x="610" y="514" font-family="Arial, sans-serif" font-size="13" fill="#334155">₹350.00</text>
  <text x="690" y="514" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">₹350.00</text>
  <line x1="50" y1="530" x2="750" y2="530" stroke="#f1f5f9"/>

  <!-- Row 3 -->
  <rect x="50" y="531" width="700" height="42" fill="#ffffff"/>
  <text x="65" y="557" font-family="Arial, sans-serif" font-size="12" fill="#334155">CPT-71046</text>
  <text x="160" y="557" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">Chest Radiologic Examination, 2 Views Frontal/Lateral</text>
  <text x="540" y="557" font-family="Arial, sans-serif" font-size="13" fill="#334155">1</text>
  <text x="610" y="557" font-family="Arial, sans-serif" font-size="13" fill="#334155">₹850.00</text>
  <text x="690" y="557" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">₹850.00</text>
  <line x1="50" y1="573" x2="750" y2="573" stroke="#f1f5f9"/>

  <!-- Row 4 -->
  <rect x="50" y="574" width="700" height="42" fill="#f8fafc"/>
  <text x="65" y="600" font-family="Arial, sans-serif" font-size="12" fill="#334155">CPT-93306</text>
  <text x="160" y="600" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">Transthoracic Echocardiogram Complete with Doppler</text>
  <text x="540" y="600" font-family="Arial, sans-serif" font-size="13" fill="#334155">1</text>
  <text x="610" y="600" font-family="Arial, sans-serif" font-size="13" fill="#334155">₹1,650.00</text>
  <text x="680" y="600" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">₹1,650.00</text>
  <line x1="50" y1="616" x2="750" y2="616" stroke="#cbd5e1"/>

  <!-- Financial Summary Box -->
  <g transform="translate(420, 640)">
    <rect width="330" height="175" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Subtotal Gross Charges:</text>
    <text x="290" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="end">₹3,950.00</text>

    <text x="20" y="60" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Contractual In-Network Discount:</text>
    <text x="290" y="60" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="end">-₹200.00</text>

    <text x="20" y="90" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Patient Co-Pay Deductible:</text>
    <text x="290" y="90" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#64748b" text-anchor="end">-₹150.00</text>

    <line x1="15" y1="115" x2="315" y2="115" stroke="#94a3b8"/>

    <text x="20" y="148" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">NET CLAIM AMOUNT:</text>
    <text x="290" y="148" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0284c7" text-anchor="end">₹3,600.00</text>
  </g>

  <!-- Attestation & Signatures -->
  <g transform="translate(50, 850)">
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#64748b">I hereby certify that the treatment rendered was medically indicated and billed according to standard CMS guidelines.</text>
    <line x1="0" y1="90" x2="260" y2="90" stroke="#0f172a" stroke-width="1.5"/>
    <text x="0" y="110" font-family="'Brush Script MT', cursive, sans-serif" font-size="24" fill="#1e293b">Dr. Gregory House, MD</text>
    <text x="0" y="128" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Chief of Diagnostic Medicine • Lic # MD-992384-CA</text>

    <line x1="450" y1="90" x2="700" y2="90" stroke="#0f172a" stroke-width="1.5"/>
    <text x="450" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">2026-09-21</text>
    <text x="450" y="128" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Official Date of Hospital Discharge</text>
