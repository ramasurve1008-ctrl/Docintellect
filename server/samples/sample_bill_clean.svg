  <text x="65" y="235" font-family="Arial, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold">Name:</tspan> David K. Miller</text>
  <text x="65" y="255" font-family="Arial, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold">Patient ID:</tspan> PAT-77281 (Age: 42, Male)</text>
  <text x="65" y="275" font-family="Arial, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold">Insurance:</tspan> Aetna Comprehensive Gold</text>
  <text x="65" y="295" font-family="Arial, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold">Policy #:</tspan> POL-AET-994821</text>

  <rect x="410" y="185" width="340" height="130" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="425" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">ENCOUNTER &amp; BILLING DETAILS</text>
  <text x="425" y="235" font-family="Arial, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold">Invoice #:</tspan> INV-2026-88194</text>
  <text x="425" y="255" font-family="Arial, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold">Admission Date:</tspan> 2026-09-19</text>
  <text x="425" y="275" font-family="Arial, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold">Discharge Date:</tspan> 2026-09-21</text>
  <text x="425" y="295" font-family="Arial, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold">Attending MD:</tspan> Dr. Gregory House, M.D.</text>

