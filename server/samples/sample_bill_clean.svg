  <text x="65" y="352" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">PRIMARY CLINICAL DIAGNOSES (ICD-10-CM)</text>
  <text x="65" y="372" font-family="Arial, sans-serif" font-size="13" fill="#1e3a8a">• I24.9 - Acute Coronary Syndrome (Primary)   • I10 - Essential (Primary) Hypertension</text>

