  <text x="50" y="160" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0369a1">INPATIENT MEDICAL BILL &amp; CLAIM SUMMARY</text>
  <rect x="580" y="140" width="170" height="30" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="592" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#15803d">CLAIM RECONCILED ✓</text>

