  <text x="65" y="428" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">CODE</text>
  <text x="160" y="428" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">ITEMIZED PROCEDURE / SERVICE</text>
