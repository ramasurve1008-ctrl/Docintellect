<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="100%" height="100%">
  <!-- Paper Background with subtle shadow -->
  <rect width="800" height="1050" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="10" fill="#0284c7"/>
  
  <!-- Header / Hospital Branding -->
  <g transform="translate(50, 45)">
    <circle cx="28" cy="28" r="28" fill="#e0f2fe"/>
    <path d="M28 14 V42 M14 28 H42" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <text x="70" y="24" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">ST. JUDE COMPREHENSIVE MEDICAL CENTER</text>
    <text x="70" y="44" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Cardiology &amp; Inpatient Care • 742 Evergreen Terrace, Springfield, OR</text>
    <text x="70" y="60" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Phone: (800) 555-0199 • Tax ID / NPI: 992384-CA</text>
  </g>

  <!-- Title & Invoice Badge -->
