<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="100%" height="100%">
  <rect width="800" height="1050" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="12" fill="#6366f1"/>

  <g transform="translate(60, 45)">
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#312e81">QUEST DIAGNOSTICS REGIONAL LABS</text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="13" fill="#64748b">1200 Innovation Parkway, Dallas, TX • CLIA ID: 05D064321</text>
  </g>

  <line x1="60" y1="130" x2="740" y2="130" stroke="#cbd5e1" stroke-width="1.5"/>

  <g transform="translate(60, 150)">
    <rect width="680" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="25" y="30" font-family="Arial, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold">Patient:</tspan> Samantha Reed</text>
    <text x="360" y="30" font-family="Arial, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold">Specimen ID:</tspan> SP-2026-0924-A</text>
    <text x="25" y="60" font-family="Arial, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold">Collected:</tspan> 2026-09-24</text>
    <text x="360" y="60" font-family="Arial, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold">Reported:</tspan> 2026-09-25</text>
  </g>

  <!-- Lab Panel Results Table -->
  <g transform="translate(60, 270)">
    <rect width="680" height="35" rx="4" fill="#1e1b4b"/>
    <text x="20" y="23" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">TEST NAME</text>
    <text x="260" y="23" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">RESULT</text>
    <text x="380" y="23" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">UNITS</text>
    <text x="500" y="23" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">REFERENCE INTERVAL</text>
    <text x="640" y="23" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">FLAG</text>

    <!-- Row 1 -->
    <rect y="40" width="680" height="40" fill="#ffffff"/>
    <text x="20" y="65" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">Total Cholesterol</text>
    <text x="260" y="65" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">238</text>
    <text x="380" y="65" font-family="Arial, sans-serif" font-size="13" fill="#64748b">mg/dL</text>
    <text x="500" y="65" font-family="Arial, sans-serif" font-size="13" fill="#64748b">&lt; 200</text>
    <text x="640" y="65" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">HIGH</text>
    <line x1="0" y1="80" x2="680" y2="80" stroke="#f1f5f9"/>

    <!-- Row 2 -->
    <rect y="81" width="680" height="40" fill="#f8fafc"/>
    <text x="20" y="106" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">Fasting Blood Glucose</text>
    <text x="260" y="106" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">91</text>
    <text x="380" y="106" font-family="Arial, sans-serif" font-size="13" fill="#64748b">mg/dL</text>
    <text x="500" y="106" font-family="Arial, sans-serif" font-size="13" fill="#64748b">70 - 99</text>
    <text x="640" y="106" font-family="Arial, sans-serif" font-size="13" fill="#16a34a">NORMAL</text>
    <line x1="0" y1="121" x2="680" y2="121" stroke="#f1f5f9"/>

    <!-- Row 3 -->
    <rect y="122" width="680" height="40" fill="#ffffff"/>
    <text x="20" y="147" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">Serum Creatinine</text>
    <text x="260" y="147" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">0.88</text>
    <text x="380" y="147" font-family="Arial, sans-serif" font-size="13" fill="#64748b">mg/dL</text>
    <text x="500" y="147" font-family="Arial, sans-serif" font-size="13" fill="#64748b">0.57 - 1.00</text>
    <text x="640" y="147" font-family="Arial, sans-serif" font-size="13" fill="#16a34a">NORMAL</text>
  </g>

  <!-- Panel Fees Summary -->
  <g transform="translate(420, 600)">
    <rect width="320" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="13" fill="#64748b">CPT-80053 CMP Panel:</text>
    <text x="280" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="end">₹220.00</text>
    <text x="20" y="60" font-family="Arial, sans-serif" font-size="13" fill="#64748b">CPT-80061 Lipid Panel:</text>
    <text x="280" y="60" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="end">₹200.00</text>
    <line x1="15" y1="85" x2="305" y2="85" stroke="#94a3b8"/>
    <text x="20" y="118" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">TOTAL BILLED:</text>
    <text x="280" y="118" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4338ca" text-anchor="end">₹420.00</text>
  </g>
</svg>
